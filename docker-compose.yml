services:
  db:
    image: postgres:16-alpine
    container_name: price_radar_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: price_radar_redis
    restart: always
    ports: 
      - "6379:6379"
  web:
    build: ./app
    container_name: price_radar_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/usr/src/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  celery_worker:
    build: ./app
    container_name: price_radar_celery_worker
    command: celery -A core worker -l info
    volumes:
      - ./app:/usr/src/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data: